name: Release bot
description: Generate a koda-release-bot token and make it the git author.

inputs:
  app-id:
    required: true
  private-key:
    required: true
  permission-pull-requests:
    required: false

outputs:
  token:
    value: ${{ steps.app-token.outputs.token }}

runs:
  using: composite
  steps:
    - name: Generate token
      id: app-token
      uses: actions/create-github-app-token@f418cff399f7aef4c2f0ad47e25ca7a6abbdd6fc # v3.4.0
      with:
        app-id: ${{ inputs.app-id }}
        private-key: ${{ inputs.private-key }}
        permission-contents: write
        permission-pull-requests: ${{ inputs.permission-pull-requests }}

    - name: Configure git author
      shell: bash
      run: |
        git config --global user.name "koda-release-bot"
        git config --global user.email "koda-release-bot@users.noreply.github.com"
