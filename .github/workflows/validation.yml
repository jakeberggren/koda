name: Validation

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    permissions:
      pull-requests: read # List the PR's changed files.
    outputs:
      python: ${{ github.event_name == 'push' || steps.filter.outputs.python == 'true' }}
      shell: ${{ github.event_name == 'push' || steps.filter.outputs.shell == 'true' }}
      workflows: ${{ github.event_name == 'push' || steps.filter.outputs.workflows == 'true' }}
    steps:
      - name: Filter changed files
        id: filter
        if: github.event_name == 'pull_request'
        uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        with:
          filters: |
            python:
              - packages/**
              - pyproject.toml
              - uv.lock
              - .python-version
              - .github/workflows/validation.yml
              - .github/actions/setup-python/**
            shell:
              - '**/*.sh'
              - scripts/**
              - .github/workflows/validation.yml
            workflows:
              - .github/**

  lint:
    name: Lint
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python

      - name: Run ruff
        run: uv run ruff check

  typecheck:
    name: Typecheck
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python

      - name: Run ty
        run: uv run ty check

  test:
    name: Test (${{ matrix.name }})
    needs: changes
    if: needs.changes.outputs.python == 'true'
    runs-on: ${{ matrix.runs_on }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macOS arm64
            runs_on: macos-15
          - name: macOS x86_64
            runs_on: macos-15-intel
          - name: Linux x86_64
            runs_on: ubuntu-22.04
          - name: Linux arm64
            runs_on: ubuntu-22.04-arm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: $/.github/actions/setup-python

      - name: Install ripgrep on Linux
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install ripgrep on macOS
        if: runner.os == 'macOS'
        run: brew install ripgrep

      - name: Run tests
        run: uv run pytest

  shellcheck:
    name: ShellCheck
    needs: changes
    if: needs.changes.outputs.shell == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install ShellCheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck

      - name: Run ShellCheck
        run: git ls-files "*.sh" "scripts/*" | xargs -r shellcheck

  zizmor:
    name: zizmor
    needs: changes
    if: needs.changes.outputs.workflows == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: read # Check out the repository.
      security-events: write # Upload SARIF results to code scanning.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1

  # The only required check, so jobs can be skipped, added or renamed without
  # touching the ruleset.
  ci:
    name: CI
    needs:
      - changes
      - lint
      - typecheck
      - test
      - shellcheck
      - zizmor
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Fail if a job failed
        if: contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled')
        run: exit 1
