name: Build Release

on:
  workflow_call:
    inputs:
      tag:
        required: true
        type: string
      version:
        required: true
        type: string
      commit:
        required: true
        type: string
    secrets:
      KODA_RELEASE_BOT_PRIVATE_KEY:
        required: true

permissions:
  contents: read

jobs:
  build:
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      id-token: write
      attestations: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            platform: linux
            arch: x86_64
            archive_ext: tar.gz
            artifact_label: linux-x86_64

          - runner: ubuntu-22.04-arm
            platform: linux
            arch: arm64
            archive_ext: tar.gz
            artifact_label: linux-arm64

          - runner: macos-15-intel
            platform: macos
            arch: x86_64
            archive_ext: tar.gz
            artifact_label: macos-x86_64

          - runner: macos-15
            platform: macos
            arch: arm64
            archive_ext: tar.gz
            artifact_label: macos-arm64

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.commit }}
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: "pyproject.toml"

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: false

      - name: Install dependencies
        run: uv sync --locked

      - name: Build
        run: uv run pyinstaller koda.spec

      - name: Rename output folder
        shell: bash
        env:
          ASSET: koda-${{ inputs.tag }}-${{ matrix.artifact_label }}
        run: |
          mv dist/koda "dist/${ASSET}"

      - name: Archive build
        shell: bash
        env:
          ASSET: koda-${{ inputs.tag }}-${{ matrix.artifact_label }}
        run: |
          cd dist
          tar -czf "${ASSET}.tar.gz" "${ASSET}"

      - name: Attest artifact
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/koda-${{ inputs.tag }}-${{ matrix.artifact_label }}.${{ matrix.archive_ext }}

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koda-${{ inputs.tag }}-${{ matrix.artifact_label }}
          path: dist/*.${{ matrix.archive_ext }}
          if-no-files-found: error

  publish:
    name: Publish Release
    needs: build
    runs-on: ubuntu-latest
    environment: release
    env:
      GH_REPO: ${{ github.repository }}
      TAG: ${{ inputs.tag }}
      VERSION: ${{ inputs.version }}
      COMMIT: ${{ inputs.commit }}
    steps:
      - name: Set up release bot
        id: bot
        uses: $/.github/actions/release-bot
        with:
          app-id: ${{ vars.KODA_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KODA_RELEASE_BOT_PRIVATE_KEY }}

      - name: Download artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist
          pattern: koda-${{ inputs.tag }}-*
          merge-multiple: true

      - name: Validate assets and generate checksums
        shell: bash
        run: |
          set -euo pipefail

          expected_assets=(
            "koda-${TAG}-linux-x86_64.tar.gz"
            "koda-${TAG}-linux-arm64.tar.gz"
            "koda-${TAG}-macos-x86_64.tar.gz"
            "koda-${TAG}-macos-arm64.tar.gz"
          )

          for asset in "${expected_assets[@]}"; do
            if [[ ! -f "dist/${asset}" ]]; then
              echo "Missing release asset: ${asset}" >&2
              exit 1
            fi
          done

          cd dist
          sha256sum "${expected_assets[@]}" > SHA256SUMS

          for asset in "${expected_assets[@]}"; do
            jq -n --arg name "${asset}" \
              --arg sha256 "$(sha256sum "${asset}" | cut -d' ' -f1)" \
              --argjson size "$(stat -c %s "${asset}")" \
              '{name: $name, sha256: $sha256, size: $size}'
          done | jq -s --arg tag "${TAG}" --arg version "${VERSION}" --arg commit "${COMMIT}" \
            '{tag: $tag, version: $version, commit: $commit, assets: .}' > release-manifest.json

      - name: Create draft release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail

          if gh release view "${TAG}" >/dev/null 2>&1; then
            is_draft="$(gh release view "${TAG}" --json isDraft --jq '.isDraft')"
            if [[ "${is_draft}" != "true" ]]; then
              echo "Release ${TAG} already exists and is not a draft" >&2
              exit 1
            fi
          else
            gh release create "${TAG}" \
              --draft \
              --title "Release ${TAG}" \
              --generate-notes
          fi

      - name: Upload release assets
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail

          assets=(dist/*.tar.gz dist/SHA256SUMS dist/release-manifest.json)
          for asset_path in "${assets[@]}"; do
            gh release upload "${TAG}" "${asset_path}" --clobber
          done

      - name: Publish release
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          gh release edit "${TAG}" --draft=false

      - name: Summary
        shell: bash
        run: |
          {
            echo "## Release published"
            echo
            echo "- Tag: ${TAG}"
            echo "- Assets:"
            find dist -maxdepth 1 -type f -printf '  - %f\n' | sort
          } >> "${GITHUB_STEP_SUMMARY}"
