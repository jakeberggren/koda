name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump to prepare
        required: true
        default: patch
        type: choice
        options:
          - patch
          - minor
          - major
          - explicit
      version:
        description: Explicit version, without leading v. Required when bump is explicit.
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    name: Prepare Release PR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up release bot
        id: bot
        uses: $/.github/actions/release-bot
        with:
          app-id: ${{ vars.KODA_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KODA_RELEASE_BOT_PRIVATE_KEY }}
          permission-pull-requests: write

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version-file: pyproject.toml

      - name: Install uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --locked

      - name: Compute version
        id: version
        shell: bash
        env:
          BUMP: ${{ inputs.bump }}
          EXPLICIT_VERSION: ${{ inputs.version }}
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: |
          set -euo pipefail

          current_version="$(uv run bump-my-version show current_version)"

          if [[ "${BUMP}" == "explicit" ]]; then
            new_version="${EXPLICIT_VERSION}"
            if [[ ! "${new_version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
              echo "Explicit version must look like X.Y.Z: ${new_version}" >&2
              exit 1
            fi
            highest="$(printf '%s\n' "${current_version}" "${new_version}" | sort -V | tail -n1)"
            if [[ "${new_version}" == "${current_version}" || "${highest}" != "${new_version}" ]]; then
              echo "${new_version} must be greater than ${current_version}" >&2
              exit 1
            fi
          else
            new_version="$(uv run bump-my-version show new_version --increment "${BUMP}")"
          fi

          tag="v${new_version}"
          branch="release/${tag}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

          open_release_prs="$(gh pr list --state open --json headRefName \
            --jq '[.[] | select(.headRefName | startswith("release/v"))] | length')"
          if [[ "${open_release_prs}" != "0" ]]; then
            echo "Another release PR is already open" >&2
            exit 1
          fi

          {
            echo "current=${current_version}"
            echo "version=${new_version}"
            echo "tag=${tag}"
            echo "branch=${branch}"
          } >> "${GITHUB_OUTPUT}"

      - name: Create release branch
        shell: bash
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
        run: git switch -c "${BRANCH}"

      - name: Bump version
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: uv run bump-my-version bump --new-version "${VERSION}" --no-commit --no-tag

      - name: Refresh lockfile
        run: uv lock

      - name: Validate version files
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: .github/scripts/release.sh versions "${VERSION}"

      - name: Commit release bump
        shell: bash
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git add pyproject.toml packages/*/pyproject.toml uv.lock
          git diff --cached --quiet && {
            echo "No release changes were produced" >&2
            exit 1
          }
          # Release-Base is the main commit this release is frozen at.
          git commit -m "release: bump version to ${VERSION}" --trailer "Release-Base: $(git rev-parse HEAD)"

      - name: Push release branch
        shell: bash
        env:
          BRANCH: ${{ steps.version.outputs.branch }}
          GH_TOKEN: ${{ steps.bot.outputs.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "HEAD:refs/heads/${BRANCH}"

      - name: Open release PR
        shell: bash
        env:
          GH_TOKEN: ${{ steps.bot.outputs.token }}
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          CURRENT_VERSION: ${{ steps.version.outputs.current }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          set -euo pipefail

          body="$(mktemp)"
          {
            echo "## Release"
            echo
            echo "- Current version: ${CURRENT_VERSION}"
            echo "- Target version: ${VERSION}"
            echo "- Tag after merge: ${TAG}"
            echo
            echo "After this PR is merged, the release workflow will tag its head commit as ${TAG}."
          } > "${body}"

          gh pr create \
            --base main \
            --head "${BRANCH}" \
            --title "release: ${TAG}" \
            --body-file "${body}"

      - name: Summary
        shell: bash
        env:
          TAG: ${{ steps.version.outputs.tag }}
          VERSION: ${{ steps.version.outputs.version }}
          BRANCH: ${{ steps.version.outputs.branch }}
        run: |
          {
            echo "## Release PR prepared"
            echo
            echo "- Version: ${VERSION}"
            echo "- Tag after merge: ${TAG}"
            echo "- Branch: ${BRANCH}"
          } >> "${GITHUB_STEP_SUMMARY}"
