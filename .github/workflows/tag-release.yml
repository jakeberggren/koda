name: Tag Release

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened
      - edited
      - closed

permissions:
  contents: read
  pull-requests: read

concurrency:
  group: tag-release-${{ github.event.pull_request.number }}
  cancel-in-progress: false

jobs:
  validate:
    name: Validate Release PR
    if: >-
      ${{
        startsWith(github.event.pull_request.head.ref, 'release/v') &&
        (github.event.action != 'closed' || github.event.pull_request.merged == true)
      }}
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      release_sha: ${{ github.event.pull_request.head.sha }}
    steps:
      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
          persist-credentials: false

      - name: Validate release
        id: release
        shell: bash
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail

          if [[ "${PR_TITLE}" =~ ^release:\ v([0-9]+\.[0-9]+\.[0-9]+)$ ]]; then
            version="${BASH_REMATCH[1]}"
          else
            echo "Release PR title must be 'release: vX.Y.Z': ${PR_TITLE}" >&2
            exit 1
          fi

          tag="v${version}"

          # Tag the release PR's own head, not main's squash commit, so PRs
          # merged while the release PR was open stay out of the release.
          # Run main's checker, not the copy in the PR, which the PR could edit.
          git fetch origin main
          git show origin/main:.github/scripts/release.sh | bash -s -- commit "${version}"

          if git ls-remote --exit-code --tags origin "refs/tags/${tag}" >/dev/null 2>&1; then
            echo "Tag already exists: ${tag}" >&2
            exit 1
          fi

          {
            echo "version=${version}"
            echo "tag=${tag}"
          } >> "${GITHUB_OUTPUT}"

  tag:
    name: Tag Release
    needs: validate
    if: ${{ github.event.action == 'closed' && github.event.pull_request.merged == true }}
    runs-on: ubuntu-latest
    steps:
      - name: Generate token
        id: app-token
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.KODA_RELEASE_BOT_APP_ID }}
          private-key: ${{ secrets.KODA_RELEASE_BOT_PRIVATE_KEY }}
          permission-contents: write

      - name: Checkout release commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ needs.validate.outputs.release_sha }}
          persist-credentials: false

      - name: Configure git author
        shell: bash
        run: |
          git config user.name "koda-release-bot"
          git config user.email "koda-release-bot@users.noreply.github.com"

      - name: Create annotated tag
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: git tag -a "${TAG}" -m "Release ${TAG}" "${RELEASE_SHA}"

      - name: Push tag
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
        run: git push "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "refs/tags/${TAG}"

      - name: Summary
        shell: bash
        env:
          TAG: ${{ needs.validate.outputs.tag }}
          VERSION: ${{ needs.validate.outputs.version }}
          RELEASE_SHA: ${{ needs.validate.outputs.release_sha }}
        run: |
          {
            echo "## Release tagged"
            echo
            echo "- Version: ${VERSION}"
            echo "- Tag: ${TAG}"
            echo "- Commit: ${RELEASE_SHA}"
          } >> "${GITHUB_STEP_SUMMARY}"
